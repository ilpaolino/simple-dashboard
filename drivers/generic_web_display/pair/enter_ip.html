<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <!--
      Pairing views: Homey is injected globally by the client.
      Do NOT load /homey.js here.
      @see https://apps.developer.homey.app/advanced/custom-views/custom-pairing-views
    -->

    <section id="step-ip">
      <header class="homey-header">
        <h1 class="homey-title" data-i18n="pair.enterIp.title">IP address</h1>
        <p class="homey-subtitle" data-i18n="pair.generic.subtitle">
          Enter the IPv4 address of the generic web display.
        </p>
      </header>

      <form class="homey-form" id="ip-form" action="#" method="post">
        <fieldset class="homey-form-fieldset">
          <legend class="homey-form-legend" data-i18n="pair.enterIp.legend">
            Connection
          </legend>
          <div class="homey-form-group">
            <label class="homey-form-label" for="ip" data-i18n="pair.enterIp.ip">
              IP address
            </label>
            <input
              class="homey-form-input"
              id="ip"
              name="ip"
              type="text"
              inputmode="decimal"
              autocomplete="off"
              required
            />
            <p class="homey-form-help" data-i18n="pair.enterIp.ipHelp">
              Example: 192.168.1.50
            </p>
          </div>
        </fieldset>

        <button
          id="add"
          type="submit"
          class="homey-button-primary-full"
          data-i18n="pair.generic.add"
        >
          Add device
        </button>
      </form>
    </section>

    <script type="application/javascript">
      (function () {
        var started = false;

        function start(Homey) {
          if (started) {
            return;
          }
          started = true;

          Homey.setNavigationClose();
          Homey.setTitle(Homey.__('pair.enterIp.title'));

          var ipForm = document.getElementById('ip-form');
          var ipElement = document.getElementById('ip');
          var addButton = document.getElementById('add');

          function setLoading(button, loading) {
            if (loading) {
              button.classList.add('is-loading');
              button.disabled = true;
              try {
                Homey.showLoadingOverlay();
              } catch (error) {}
              return;
            }
            button.classList.remove('is-loading');
            button.disabled = false;
            try {
              Homey.hideLoadingOverlay();
            } catch (error) {}
          }

          ipForm.addEventListener('submit', function (event) {
            event.preventDefault();
            setLoading(addButton, true);

            Homey.emit('probe', { ip: ipElement.value })
              .then(function () {
                return Homey.emit('get_pairing_device');
              })
              .then(function (device) {
                return Homey.createDevice(device);
              })
              .then(function () {
                Homey.done();
              })
              .catch(function (error) {
                setLoading(addButton, false);
                Homey.alert(
                  (error && error.message) ||
                    Homey.__('errors.createDeviceFailed'),
                );
              });
          });
        }

        if (typeof Homey !== 'undefined') {
          start(Homey);
        }

        window.onHomeyReady = function (HomeyApi) {
          start(HomeyApi);
        };
      })();
    </script>
  </body>
</html>

<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <!--
      Pairing views: Homey is injected globally by the client.
      Do NOT load /homey.js here.
      @see https://apps.developer.homey.app/advanced/custom-views/custom-pairing-views
    -->

    <section id="step-ip">
      <header class="homey-header">
        <h1 class="homey-title" data-i18n="pair.enterIp.title">IP address</h1>
        <p class="homey-subtitle" data-i18n="pair.shelly.subtitle">
          Enter the IPv4 address of the Shelly Wall Display.
        </p>
      </header>

      <form class="homey-form" id="ip-form" action="#" method="post">
        <fieldset class="homey-form-fieldset">
          <legend class="homey-form-legend" data-i18n="pair.enterIp.legend">
            Connection
          </legend>
          <div class="homey-form-group">
            <label class="homey-form-label" for="ip" data-i18n="pair.enterIp.ip">
              IP address
            </label>
            <input
              class="homey-form-input"
              id="ip"
              name="ip"
              type="text"
              inputmode="decimal"
              autocomplete="off"
              required
            />
            <p class="homey-form-help" data-i18n="pair.enterIp.ipHelp">
              Example: 192.168.1.50
            </p>
          </div>
        </fieldset>

        <button
          id="probe"
          type="submit"
          class="homey-button-primary-full"
          data-i18n="pair.enterIp.continue"
        >
          Connect
        </button>
      </form>
    </section>

    <section id="step-confirm" style="display: none;">
      <header class="homey-header">
        <h1 class="homey-title" data-i18n="pair.confirm.title">Device found</h1>
        <p class="homey-subtitle" data-i18n="pair.confirm.subtitle">
          Confirm that this is the wall display you want to add.
        </p>
      </header>

      <div class="homey-form">
        <fieldset class="homey-form-fieldset">
          <legend class="homey-form-legend" data-i18n="pair.confirm.legend">
            Detected information
          </legend>

          <div class="homey-form-group">
            <label class="homey-form-label" data-i18n="pair.confirm.adapter">Type</label>
            <p class="homey-form-help" id="adapter">—</p>
          </div>
          <div class="homey-form-group">
            <label class="homey-form-label" data-i18n="pair.confirm.manufacturer">Manufacturer</label>
            <p class="homey-form-help" id="manufacturer">—</p>
          </div>
          <div class="homey-form-group">
            <label class="homey-form-label" data-i18n="pair.confirm.model">Model</label>
            <p class="homey-form-help" id="model">—</p>
          </div>
          <div class="homey-form-group">
            <label class="homey-form-label" data-i18n="pair.confirm.firmware">Firmware</label>
            <p class="homey-form-help" id="firmware">—</p>
          </div>
          <div class="homey-form-group">
            <label class="homey-form-label" data-i18n="pair.confirm.serial">UUID / Serial</label>
            <p class="homey-form-help" id="serial">—</p>
          </div>
          <div class="homey-form-group" id="hardware-summary" style="display: none;">
            <label class="homey-form-label" data-i18n="pair.confirm.hardwareLegend">Hardware</label>
            <p class="homey-form-help" id="hardware-discovery">—</p>
            <p class="homey-form-help" id="hardware-reboot">—</p>
            <p class="homey-form-help" id="hardware-methods">—</p>
            <p class="homey-form-help" id="hardware-warning" style="display: none;">—</p>
          </div>
        </fieldset>

        <button
          id="confirm-add"
          type="button"
          class="homey-button-primary-full"
          data-i18n="pair.confirm.confirm"
        >
          Add device
        </button>
        <button
          id="confirm-back"
          type="button"
          class="homey-button-secondary-shadow"
          data-i18n="pair.back"
        >
          Back
        </button>
      </div>
    </section>

    <script type="application/javascript">
      (function () {
        var started = false;

        function start(Homey) {
          if (started) {
            return;
          }
          started = true;

          Homey.setNavigationClose();
          Homey.setTitle(Homey.__('pair.enterIp.title'));

          var stepIp = document.getElementById('step-ip');
          var stepConfirm = document.getElementById('step-confirm');
          var ipForm = document.getElementById('ip-form');
          var ipElement = document.getElementById('ip');
          var probeButton = document.getElementById('probe');
          var confirmAddButton = document.getElementById('confirm-add');
          var confirmBackButton = document.getElementById('confirm-back');

          function showStep(step) {
            stepIp.style.display = step === 'ip' ? '' : 'none';
            stepConfirm.style.display = step === 'confirm' ? '' : 'none';
            Homey.setTitle(
              step === 'ip'
                ? Homey.__('pair.enterIp.title')
                : Homey.__('pair.confirm.title'),
            );
          }

          function setLoading(button, loading) {
            if (loading) {
              button.classList.add('is-loading');
              button.disabled = true;
              try {
                Homey.showLoadingOverlay();
              } catch (error) {}
              return;
            }
            button.classList.remove('is-loading');
            button.disabled = false;
            try {
              Homey.hideLoadingOverlay();
            } catch (error) {}
          }

          function fillDetectedInfo(info) {
            document.getElementById('adapter').textContent = info.adapterName;
            document.getElementById('manufacturer').textContent = info.manufacturer;
            document.getElementById('model').textContent = info.model;
            document.getElementById('firmware').textContent = info.firmware;
            document.getElementById('serial').textContent = info.serial;
          }

          function fillHardwareSummary(summary) {
            var section = document.getElementById('hardware-summary');
            if (!summary) {
              section.style.display = 'none';
              return;
            }
            section.style.display = '';
            document.getElementById('hardware-discovery').textContent =
              Homey.__('pair.confirm.hardwareDiscovery') + ': ' + summary.discoveryStatus;
            document.getElementById('hardware-reboot').textContent =
              Homey.__('pair.confirm.hardwareReboot') + ': ' + summary.rebootStatus;
            document.getElementById('hardware-methods').textContent =
              Homey.__('pair.confirm.hardwareMethods') + ': ' + summary.rpcMethodCount;
            var warning = document.getElementById('hardware-warning');
            if (summary.warning) {
              warning.style.display = '';
              warning.textContent = summary.warning;
            } else {
              warning.style.display = 'none';
              warning.textContent = '';
            }
          }

          function createPairedDevice() {
            return Homey.emit('get_pairing_device')
              .then(function (device) {
                return Homey.createDevice(device);
              })
              .then(function () {
                Homey.done();
              });
          }

          ipForm.addEventListener('submit', function (event) {
            event.preventDefault();
            setLoading(probeButton, true);
            Homey.emit('probe', { ip: ipElement.value })
              .then(function () {
                return Homey.emit('get_detected_info');
              })
              .then(function (info) {
                fillDetectedInfo(info);
                return Homey.emit('get_hardware_summary');
              })
              .then(function (summary) {
                fillHardwareSummary(summary);
                showStep('confirm');
              })
              .catch(function (error) {
                Homey.alert(
                  (error && error.message) || Homey.__('errors.invalidIp'),
                );
              })
              .then(function () {
                setLoading(probeButton, false);
              });
          });

          confirmAddButton.addEventListener('click', function () {
            setLoading(confirmAddButton, true);
            createPairedDevice().catch(function (error) {
              setLoading(confirmAddButton, false);
              Homey.alert(
                (error && error.message) || Homey.__('errors.createDeviceFailed'),
              );
            });
          });

          confirmBackButton.addEventListener('click', function () {
            showStep('ip');
          });
        }

        if (typeof Homey !== 'undefined') {
          start(Homey);
        }

        window.onHomeyReady = function (HomeyApi) {
          start(HomeyApi);
        };
      })();
    </script>
  </body>
</html>
